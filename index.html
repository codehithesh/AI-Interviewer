<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interviewer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<noscript>
  <div class="boot-error">This app needs JavaScript. Enable it for this page and reload.</div>
</noscript>

<!-- ============================================================
     Boot guard — it reports WHY the page is empty, in the page itself, so nobody
     has to open a console to find out.

     It must run BEFORE the app scripts. Two distinct failures reach it:
       · a <script> that will not load fires 'error' on the element, and that
         event does not bubble — so the listener is registered in the capture
         phase, before the element exists;
       · init() is async, so a throw inside it arrives as an unhandled rejection
         and never reaches a window 'error' handler at all.
     Opening this file directly (file://) is the most common cause of the first
     one: some browsers refuse to read sibling files for a local page. Serve the
     directory over http://localhost instead. The microphone and the camera
     require a secure context, which file:// is not — and Chrome's speech
     recognition does not exist there either.
     ============================================================ -->
<script>
(function () {
  function base(p) { return String(p || '').split('/').pop().split('?')[0] || 'unknown'; }
  function fail(why) {
    var box = document.querySelector('.boot-error');
    if (box) {
      if (box.textContent.indexOf(why) < 0) box.textContent += '\n\n· ' + why;
      return;
    }
    box = document.createElement('div');
    box.className = 'boot-error';
    box.textContent = 'AI Interviewer failed to start.\n\n· ' + why
      + '\n\nIf this page was opened as a file:// URL, that is the usual cause: '
      + 'the browser will not read the js/ files next to it. Serve the folder over '
      + 'http://localhost instead (e.g. python3 -m http.server 8123) and reload.';
    document.body.appendChild(box);
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') {
      fail('the script ' + base(e.target.src) + ' did not load');
    } else {
      fail('error in ' + base(e.filename) + ':' + e.lineno + ' — ' + e.message);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    // r.stack names the file and line, which is the whole point of showing this
    fail(String(r.stack || r.message || r));
  });
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (document.querySelector('[data-view="interview"]')) {
        fail('the interface did not mount (js/interview-view.js did not run)');
      }
    }, 500);
  });
})();
</script>

<div class="app">

  <!-- The interview screen is the whole app. Its markup lives in
       js/interview-view.js — a page opened over file:// may not read other local
       files, so each view carries its markup in its own script and mounts it
       before any behaviour is wired. -->
  <div data-view="interview"></div>

  <!-- ===================== TOAST STACK (bottom-left; each dismissed by hand) ===================== -->
  <div id="toast-stack" class="toast-stack" role="status" aria-live="polite"></div>
</div>

<!-- The settings modal is mounted here — markup in js/settings-view.js. -->
<div data-view="settings"></div>

<!-- ============================================================
     Plain scripts, loaded in dependency order — deliberately NOT ES modules:
     module scripts are blocked on file://, and index.html is meant to keep
     working when opened straight from disk.
     ============================================================ -->

<!-- 1 · view markup, mounted into the mount points above -->
<script src="js/view.js"></script>
<script src="js/interview-view.js"></script>
<script src="js/settings-view.js"></script>

<!-- 2 · foundation: state, helpers, markdown, element cache, appearance -->
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/markdown.js"></script>
<script src="js/dom.js"></script>
<script src="js/theme.js"></script>

<!-- 3 · provider config + the API call functions -->
<script src="js/providers.js"></script>
<script src="js/api.js"></script>

<!-- 4 · native speech + media: text-to-speech, speech-to-text, participants -->
<script src="js/tts.js"></script>
<script src="js/stt.js"></script>
<script src="js/participants.js"></script>

<!-- 5 · saved settings -->
<script src="js/store.js"></script>
<script src="js/settings.js"></script>

<!-- 6 · composer, the code editor popup, the interview engine, export -->
<script src="js/composer.js"></script>
<script src="js/code-editor.js"></script>
<script src="js/interviewer.js"></script>
<script src="js/interview.js"></script>
<script src="js/export.js"></script>

<!-- 7 · boot -->
<script src="js/main.js"></script>
</body>
</html>
